{% extends 'base.html' %}

{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="display-1 text-danger fw-bold"><i class="fas fa-lock"></i> 403</div>
        <h3 class="fw-bold mt-3">Access Denied / Forbidden</h3>
        <p class="text-muted">You do not have the required role or administrative permissions to access this warehouse module.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-wh mt-2">
            <i class="fas fa-home me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
