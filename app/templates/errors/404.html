{% extends 'base.html' %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="display-1 text-primary fw-bold"><i class="fas fa-box-open"></i> 404</div>
        <h3 class="fw-bold mt-3">Resource or Location Not Found</h3>
        <p class="text-muted">The requested warehouse record, SKU, or page does not exist or may have been relocated.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-wh mt-2">
            <i class="fas fa-home me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
